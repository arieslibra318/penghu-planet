<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="澎湖小行星：在小小的澎湖星球上騎單車、蓋景點章，搭船到吉貝、桶盤、虎井、望安、七美找回五顆星火，一起看海上花火節。">
<meta property="og:title" content="澎湖小行星">
<meta property="og:description" content="在小小的澎湖星球上探險、集章、搭船去離島的網頁小遊戲。">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>澎湖小行星</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Fredoka:wght@600;700&display=swap">
<style>
/* 版面：全螢幕 3D 畫布＋浮在上面的「澎湖插畫地圖」風格 HUD（米白紙卡、湖水藍、定位針粉紅） */
:root{
  --sea:#2fb3b5; --sea-deep:#167f93; --paper:#fdf6e6; --paper-2:#f3e7c9;
  --ink:#1f4f57; --ink-soft:#4f7b80; --pin:#e8789a; --pin-deep:#c9557a;
  --sun:#f5c245; --coral:#e0584a; --leaf:#8fbf6a; --shadow:rgba(20,60,66,.28);
  --f-ui:'Huninn','Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --f-logo:'Fredoka','Huninn',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;background:#9fdde0;color:var(--ink);font-family:var(--f-ui);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--pin);outline-offset:2px}
.paper{background:var(--paper);border:2.5px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink),0 10px 24px var(--shadow)}
.hide{display:none!important}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none}
#hud > *{pointer-events:auto}
#tl{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;align-items:flex-start;max-width:min(62vw,340px)}
.brand{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px}
.brand canvas{width:44px;height:44px;border-radius:50%;background:#bfe9e6;border:2px solid var(--ink)}
.brand b{display:block;font-size:17px;letter-spacing:.04em}
.brand small{display:block;font-size:12px;color:var(--ink-soft);margin-top:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 6px;font-size:13px;background:var(--paper);border:2px solid var(--ink);border-radius:999px;box-shadow:0 2px 0 var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip svg{width:18px;height:18px;flex:none}
.chip.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25)}}
#tr{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:8px;align-items:flex-start}
.ib{width:46px;height:46px;border-radius:14px;background:var(--paper);border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;padding:0;position:relative}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.ib svg{width:26px;height:26px}
.ib.off::after{content:"";position:absolute;left:8px;right:8px;top:50%;height:3px;background:var(--coral);transform:rotate(-40deg);border-radius:2px}
.ib .badge{position:absolute;right:-6px;top:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--pin);color:#fff;font-size:11px;display:grid;place-items:center;border:2px solid var(--ink);padding:0 3px}
#clockWrap{display:flex;flex-direction:column;align-items:center;gap:4px}
#clock{font-size:12px;padding:1px 8px;background:var(--paper);border:2px solid var(--ink);border-radius:8px;font-variant-numeric:tabular-nums;white-space:nowrap}
#tide{font-size:11px;padding:1px 7px;background:#dff5f3;border:2px solid var(--ink);border-radius:8px;white-space:nowrap}
#guide{position:absolute;left:50%;top:calc(66px + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:6px 12px 6px 8px;font-size:13px;display:flex;align-items:center;gap:8px;white-space:nowrap;max-width:calc(100vw - 32px)}
#guide button{border:none;background:none;font-size:18px;line-height:1;padding:0 2px}
#prompt{position:absolute;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:8px 16px;font-size:15px;white-space:nowrap;display:flex;align-items:center;gap:8px;cursor:pointer}
#prompt kbd{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:6px;background:var(--ink);color:var(--paper);font-family:var(--f-logo);font-size:14px}
#toasts{position:absolute;left:50%;top:calc(110px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{padding:8px 16px;font-size:14px;background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;box-shadow:0 3px 0 var(--ink);animation:tin .35s ease-out,tout .4s ease-in 2.6s forwards;white-space:nowrap}
.toast b{color:var(--pin-deep)}
@keyframes tin{from{transform:translateY(-12px) scale(.9);opacity:0}}
@keyframes tout{to{transform:translateY(-8px);opacity:0}}
#hint{position:absolute;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:12px;padding:5px 14px;background:rgba(253,246,230,.92);border:2px solid var(--ink);border-radius:999px;white-space:nowrap;pointer-events:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);font-size:12px;padding:2px 8px;background:rgba(253,246,230,.94);border:2px solid var(--ink);border-radius:8px;white-space:nowrap;pointer-events:none;will-change:transform}
.lbl.done{border-color:var(--pin-deep)}
.lbl.done::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pin);margin-right:5px;vertical-align:1px}
.lbl.me{background:var(--pin);color:#fff;border-color:var(--ink)}
.lbl.map{pointer-events:auto;cursor:pointer;font-size:13px}
.lbl.map:hover{background:#fff}
.lbl.reg{background:none;border:none;font-size:15px;color:#fff;text-shadow:0 2px 0 var(--ink),0 0 6px var(--ink);letter-spacing:.2em}
#mapbar{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:8px;align-items:center;padding:6px 8px 6px 14px;font-size:13px;white-space:nowrap}
.btn{border:2.5px solid var(--ink);background:var(--paper);border-radius:12px;padding:7px 14px;font-size:15px;box-shadow:0 3px 0 var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.pri{background:var(--pin);color:#fff}
.btn.sea{background:var(--sea);color:#fff}

/* ---------- touch ---------- */
#touch{position:absolute;inset:0;pointer-events:none}
#joy{position:absolute;left:calc(26px + env(safe-area-inset-left,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:128px;height:128px;border-radius:50%;background:rgba(253,246,230,.35);border:2.5px solid rgba(31,79,87,.6);pointer-events:auto;touch-action:none}
#joyK{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:var(--paper);border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
#tbtns{position:absolute;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(2,64px);grid-template-rows:repeat(2,64px);gap:12px;pointer-events:auto}
.tb{border-radius:50%;background:var(--paper);border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-size:15px;display:grid;place-items:center;touch-action:none;padding:0}
.tb.big{background:var(--pin);color:#fff;grid-column:2;grid-row:1/3;align-self:center;width:72px;height:72px;font-size:17px}
.tb.on{background:var(--sun)}

/* ---------- dialog ---------- */
#dialog{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(680px,calc(100vw - 24px));display:flex;gap:12px;padding:14px 16px 14px 14px;align-items:flex-start;cursor:pointer}
#dlgP{width:72px;height:72px;flex:none;border-radius:50%;border:2.5px solid var(--ink);background:#cdeee9}
#dlgBody{flex:1;min-width:0}
#dlgName{display:inline-block;font-size:14px;background:var(--ink);color:var(--paper);padding:2px 10px;border-radius:8px;margin-bottom:6px}
#dlgText{font-size:17px;line-height:1.6;min-height:3.2em;text-wrap:pretty}
#dlgNext{position:absolute;right:16px;bottom:10px;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:10px solid var(--pin);animation:nb .8s infinite}
@keyframes nb{50%{transform:translateY(4px)}}
#dlgCh{display:flex;flex-direction:column;gap:8px;margin-top:8px}
#dlgCh button{text-align:left;border:2.5px solid var(--ink);background:#fff;border-radius:12px;padding:8px 14px;font-size:16px;box-shadow:0 3px 0 var(--ink)}
#dlgCh button:hover,#dlgCh button.sel{background:#ffe7ef}

/* ---------- panels ---------- */
.modal{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,60,66,.35);padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#panelBox{width:min(720px,100%);max-height:min(86vh,760px);display:flex;flex-direction:column;overflow:hidden}
.ptabs{display:flex;gap:6px;padding:12px 12px 0;align-items:center;flex-wrap:wrap}
.ptab{border:2.5px solid var(--ink);border-bottom:none;border-radius:12px 12px 0 0;background:var(--paper-2);padding:7px 14px;font-size:15px}
.ptab.on{background:#fff}
.ptabs .x{margin-left:auto;width:36px;height:36px;border-radius:10px;border:2.5px solid var(--ink);background:#fff;font-size:20px;line-height:1;padding:0}
.pbody{background:#fff;border-top:2.5px solid var(--ink);overflow:auto;padding:14px 16px 18px;flex:1;min-height:0}
.score{display:flex;flex-wrap:wrap;gap:8px 14px;padding:8px 12px;background:#fff6d8;border-radius:10px;font-size:14px;margin-bottom:10px;font-variant-numeric:tabular-nums}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.tasks li{display:flex;gap:10px;align-items:baseline;padding:7px 4px;border-bottom:1.5px dashed #d8e4e0;font-size:15px;line-height:1.45}
.tasks li .n{width:26px;flex:none;text-align:right;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.tasks li.ok{color:#9aaeae}
.tasks li.ok .t{text-decoration:line-through;text-decoration-color:var(--pin)}
.tasks li.ok .n{color:var(--pin)}
.tasks li .go{margin-left:auto;flex:none;border:2px solid var(--ink);border-radius:8px;background:#e3f6f4;font-size:12px;padding:2px 8px}
.tasks h4{margin:12px 0 4px;font-size:13px;color:var(--ink-soft);letter-spacing:.1em}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.stamp{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;text-align:center}
.stamp canvas{width:92px;height:92px;border-radius:12px;background:#fbf5e8;border:1.5px dashed #c9bfa5}
.stamp.no{color:#a9b5b3}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1.5px dashed #d8e4e0;font-size:15px}
.helpk{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin-top:6px}
.helpk kbd{font-family:var(--f-logo);background:var(--paper-2);border:2px solid var(--ink);border-radius:6px;padding:0 6px;text-align:center}

/* info card */
#cardBox{width:min(460px,100%);padding:18px 18px 16px;position:relative}
#cardReg{font-size:12px;letter-spacing:.2em;color:var(--ink-soft)}
#cardName{font-size:24px;margin:2px 0 10px;text-wrap:balance}
#cardText{font-size:16px;line-height:1.7;margin:0 0 14px}
#cardStamp{position:absolute;right:14px;top:10px;width:96px;height:96px;transform:rotate(-12deg) scale(1);opacity:0}
#cardStamp.go{animation:stamp .55s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes stamp{0%{opacity:0;transform:rotate(-30deg) scale(2.2)}60%{opacity:1;transform:rotate(-10deg) scale(.92)}100%{opacity:1;transform:rotate(-12deg) scale(1)}}
#cardBtns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#cardSrc{font-size:12px;line-height:1.6;color:var(--ink-soft);margin:-6px 0 14px;overflow-wrap:anywhere}
#cardSrc a,.srcnote a{color:var(--sea-deep)}
.srcnote{font-size:13px;line-height:1.7;color:var(--ink-soft)}.srcnote ul{padding-left:20px;margin:6px 0}

/* minigame */
#miniBox{width:min(440px,100%);padding:18px;text-align:center}
#miniTitle{font-size:20px;margin-bottom:6px}
#miniText{font-size:14px;color:var(--ink-soft);margin-bottom:14px;line-height:1.6}
#miniBar{position:relative;height:30px;border-radius:15px;border:2.5px solid var(--ink);background:#dff3f1;overflow:hidden;margin-bottom:12px}
#miniZone{position:absolute;top:0;bottom:0;background:var(--sun)}
#miniNeedle{position:absolute;top:-2px;bottom:-2px;width:6px;margin-left:-3px;background:var(--ink);border-radius:3px}
#miniDots{display:flex;justify-content:center;gap:8px;margin-bottom:12px}
#miniDots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:#fff}
#miniDots i.ok{background:var(--pin)}
#miniDots i.bad{background:#bbb}

/* sailing */
#sail{position:absolute;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:10px 16px;display:flex;flex-direction:column;gap:6px;align-items:center;width:min(360px,calc(100vw - 32px))}
#sailT{font-size:16px}
#sailBar{width:100%;height:10px;border-radius:5px;background:#d6efed;border:2px solid var(--ink);overflow:hidden}
#sailFill{height:100%;width:0;background:var(--sea)}

/* photo */
#photoBox{padding:14px 14px 10px;background:#fff;border:2.5px solid var(--ink);border-radius:6px;box-shadow:0 10px 30px var(--shadow);transform:rotate(-2deg);text-align:center;max-width:min(420px,100%)}
#photoImg{display:block;width:100%;max-width:380px;border:2px solid #333;aspect-ratio:4/3;object-fit:cover}
#photoCap{font-size:15px;margin:10px 0 6px}

/* title */
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));background:radial-gradient(ellipse at 50% 120%,rgba(255,255,255,.0),rgba(255,255,255,0) 60%)}
#logo{font-family:var(--f-logo);font-weight:700;font-size:clamp(46px,11vw,104px);line-height:.95;color:var(--paper);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);letter-spacing:.01em}
#logo span{color:var(--pin)}
#logoSub{display:inline-block;font-family:var(--f-logo);font-weight:600;font-size:clamp(16px,3.4vw,24px);background:var(--paper);border:2.5px solid var(--ink);border-radius:10px;padding:2px 14px;box-shadow:0 3px 0 var(--ink)}
#logoZh{font-size:clamp(22px,5vw,34px);color:#fff;text-shadow:0 2px 0 var(--ink),0 0 10px rgba(31,79,87,.6);letter-spacing:.12em}
#logoZh i{font-style:normal;color:var(--pin)}
#titleBtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:10px}
#titleBtns .btn{font-size:19px;padding:10px 24px}
#titleNote{font-size:13px;color:#fff;text-shadow:0 1px 0 var(--ink),0 0 6px var(--ink)}
#loadTxt{font-size:14px;color:#fff;text-shadow:0 1px 0 var(--ink)}
#fade{position:absolute;inset:0;background:#fdf6e6;opacity:0;pointer-events:none;transition:opacity .6s}
#ending{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100vw - 32px));padding:20px;text-align:center}
#ending h2{margin:0 0 6px;font-size:24px}
#ending p{margin:6px 0;font-size:15px;line-height:1.6}
@media (max-width:560px){
  .brand{padding:3px}.brand > div{display:none}.brand canvas{width:36px;height:36px}
  #tl{max-width:calc(100vw - 250px)}
  .ib{width:38px;height:38px;border-radius:11px}.ib svg{width:21px;height:21px}
  #tr{gap:5px}
  #guide{top:calc(100px + env(safe-area-inset-top,0px))}
  #toasts{top:calc(140px + env(safe-area-inset-top,0px))}
  .toast{white-space:normal;max-width:calc(100vw - 40px);text-align:center}
  .chip{font-size:12px;padding:2px 8px 2px 5px}
  #dlgText{font-size:15px}#dlgP{width:56px;height:56px}
  #hint{display:none}
  #prompt{bottom:calc(178px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
</style>

</head>
<body>
<div id="app">
  <canvas id="c" tabindex="0" aria-label="澎湖小行星遊戲畫面"></canvas>
  <div id="labels"></div>
  <div id="hud" class="hide">
    <div id="tl">
      <div class="paper brand"><canvas id="pp" width="88" height="88"></canvas><div><b>澎湖小行星</b><small id="chap">序章・抵達馬公港</small></div></div>
      <div class="chips">
        <span class="chip" id="chStamp" title="印章"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#e0584a" stroke-width="2.4"/><circle cx="12" cy="12" r="5" fill="#e0584a"/></svg><span>0</span></span>
        <span class="chip" id="chFire" title="星火"><svg viewBox="0 0 24 24"><path d="M12 2l2.6 6.4L21 9l-5 4.4L17.5 21 12 17.3 6.5 21 8 13.4 3 9l6.4-.6z" fill="#f5c245" stroke="#1f4f57" stroke-width="1.6" stroke-linejoin="round"/></svg><span>0/5</span></span>
        <span class="chip" id="chShell" title="貝殼"><svg viewBox="0 0 24 24"><path d="M12 20c-5 0-8-4-8-8 0-3 3-7 8-7s8 4 8 7c0 4-3 8-8 8z" fill="#ffd6dc" stroke="#1f4f57" stroke-width="1.6"/><path d="M12 20V6M8 19l2-12M16 19l-2-12" stroke="#1f4f57" stroke-width="1.3"/></svg><span>0</span></span>
        <span class="chip" id="chStone" title="文石"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="13" rx="8" ry="6.5" fill="#b9805a" stroke="#1f4f57" stroke-width="1.6"/><path d="M6 12c3-2 4 2 7 0s4 1 5 1M7 15c2 1 5-1 9 1" stroke="#f3d9b5" stroke-width="1.4" fill="none"/></svg><span>0/5</span></span>
        <span class="chip" id="chCoin" title="零用錢"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="#f5c245" stroke="#1f4f57" stroke-width="1.6"/><text x="12" y="16" font-size="10" text-anchor="middle" fill="#1f4f57" font-weight="700">元</text></svg><span>300 元</span></span>
      </div>
    </div>
    <div id="tr">
      <button class="ib" id="bMap" title="星球地圖（M）" aria-label="星球地圖"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#bfe9e6" stroke="#1f4f57" stroke-width="2"/><path d="M6 9c2-1 3 1 5 0s2-3 4-2M7 15c2 0 2 2 4 2s3-2 5-1" stroke="#1f4f57" stroke-width="1.6" fill="none"/><path d="M12 3l1.6 3h-3.2z" fill="#e0584a"/></svg></button>
      <div id="clockWrap"><button class="ib" id="bTime" title="讓時間快轉（T）" aria-label="時間快轉"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.6" fill="#f5c245" stroke="#1f4f57" stroke-width="1.8"/><g stroke="#1f4f57" stroke-width="2" stroke-linecap="round"><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M5.3 18.7L7 17M17 7l1.7-1.7"/></g></svg></button><span id="clock">09:00</span><span id="tide">退潮中</span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* =========================================================
   澎湖小行星 — core: 星球數學、地形、潮汐
   ========================================================= */
const R = 60, MS = 0.15;
const V3 = THREE.Vector3;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry32(8812);
const rr = (a, b) => a + (b - a) * rnd();
const IS_TOUCH = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;

function hash3(x, y, z) { let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(z, 1274126177)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967295; }
function vnoise(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  let xf = x - xi, yf = y - yi, zf = z - zi;
  xf = xf * xf * (3 - 2 * xf); yf = yf * yf * (3 - 2 * yf); zf = zf * zf * (3 - 2 * zf);
  const a = hash3(xi, yi, zi), b = hash3(xi + 1, yi, zi), c = hash3(xi, yi + 1, zi), d = hash3(xi + 1, yi + 1, zi);
  const e = hash3(xi, yi, zi + 1), f = hash3(xi + 1, yi, zi + 1), g = hash3(xi, yi + 1, zi + 1), h = hash3(xi + 1, yi + 1, zi + 1);
  return lerp(lerp(lerp(a, b, xf), lerp(c, d, xf), yf), lerp(lerp(e, f, xf), lerp(g, h, xf), yf), zf);
}
const fbm = (x, y, z) => vnoise(x, y, z) * 0.55 + vnoise(x * 2.07 + 5.1, y * 2.07, z * 2.07) * 0.3 + vnoise(x * 4.3, y * 4.3 + 1.7, z * 4.3) * 0.15;

/* ---------- 投影：平面地圖座標 <-> 球面方向（等距方位投影） ---------- */
const MAIN = { c: new V3(0, 0, 1), e: new V3(1, 0, 0), n: new V3(0, 1, 0) };
function l2d(F, x, y, out) {
  out = out || new V3();
  const d = Math.hypot(x, y);
  if (d < 1e-9) return out.copy(F.c);
  const th = d / R, s = Math.sin(th) / d;
  return out.copy(F.c).multiplyScalar(Math.cos(th)).addScaledVector(F.e, x * s).addScaledVector(F.n, y * s).normalize();
}
function d2l(F, p) {
  const th = Math.acos(clamp(p.dot(F.c), -1, 1));
  const ex = p.dot(F.e), ny = p.dot(F.n), l = Math.hypot(ex, ny);
  if (l < 1e-9) return [0, 0];
  const d = th * R; return [ex / l * d, ny / l * d];
}
const P = (xp, yp) => [(xp - 590) * MS, (440 - yp) * MS];
function mkFrame(xp, yp) {
  const [x, y] = P(xp, yp);
  const c = l2d(MAIN, x, y), c2 = l2d(MAIN, x, y + 0.3);
  const n = c2.sub(c); n.addScaledVector(c, -n.dot(c)).normalize();
  return { c, e: new V3().crossVectors(n, c), n };
}
const angDist = (a, b) => Math.acos(clamp(a.dot(b), -1, 1)) * R;

/* ---------- 陸地（依插畫地圖描出的島形，單位：插畫像素） ---------- */
const POLY_MAIN = {
  W: [[330, 128], [390, 140], [410, 170], [440, 195], [450, 225], [430, 245], [410, 240], [385, 280], [380, 330], [370, 380], [350, 430], [345, 470], [320, 500], [270, 510], [220, 515], [180, 505], [168, 480], [195, 462], [240, 455], [280, 440], [295, 400], [285, 360], [300, 320], [290, 280], [305, 240], [310, 190], [315, 150]],
  N: [[462, 112], [500, 92], [560, 70], [610, 64], [628, 95], [660, 118], [700, 148], [732, 185], [715, 215], [660, 222], [615, 207], [590, 182], [550, 162], [505, 152], [470, 140]],
  M1: [[622, 233], [668, 230], [678, 266], [652, 288], [618, 272]],
  M2: [[674, 288], [718, 283], [734, 320], [708, 348], [674, 332]],
  A: [[470, 440], [520, 395], [590, 395], [650, 370], [700, 352], [760, 360], [820, 340], [880, 348], [935, 350], [968, 395], [995, 440], [992, 500], [965, 555], [905, 565], [855, 565], [815, 600], [775, 625], [725, 635], [690, 620], [650, 600], [605, 575], [575, 530], [535, 510], [495, 490], [470, 470]],
  B: [[430, 560], [485, 540], [530, 560], [565, 600], [570, 645], [530, 680], [480, 675], [445, 645], [432, 600]],
  C: [[545, 630], [600, 572], [692, 592], [705, 670], [690, 760], [640, 775], [595, 740], [565, 700]],
  E: [[948, 288], [986, 282], [998, 308], [972, 326], [946, 312]],   // 赤嶼
};
const ISLANDS = {
  jibei:   { name: '吉貝', at: [640, -165], poly: [[-6, 2], [-3, 5.5], [2, 6.5], [6.5, 5], [8.5, 1], [7, -3], [3, -5], [-1, -4.2], [-4, -5], [-8, -8], [-12, -11.5], [-13.5, -10.5], [-9.5, -5.2], [-7.5, -1]] },
  tongpan: { name: '桶盤', at: [392, 772], poly: [[-5, 3], [-2, 6], [3, 5.5], [6, 2], [5.5, -3], [2, -6], [-3, -5.5], [-6, -2]] },
  hujing:  { name: '虎井', at: [525, 908], poly: [[-9.5, 1], [-6.5, 4.5], [-2.5, 3.2], [1, 4.8], [5, 5.4], [9.5, 2], [8.6, -2.4], [4.4, -4.4], [0, -2.6], [-3.4, -4.4], [-7.6, -3.4]] },
  wangan:  { name: '望安', at: [395, 1088], poly: [[-7, 4], [-2, 8.5], [4, 7.6], [8.6, 3], [7.6, -3], [3, -7.6], [-3, -8.4], [-7.6, -4], [-8.6, 0]] },
  qimei:   { name: '七美', at: [522, 1300], poly: [[-8.5, 3], [-4, 7.5], [2, 8], [7.5, 5], [9.6, 0], [7.4, -5], [2, -7.6], [-4.4, -6.4], [-8.6, -2]] },
};
const LANDS = [];
(function buildLands() {
  const polys = Object.values(POLY_MAIN).map(pl => pl.map(([a, b]) => P(a, b)));
  let bd = 0; polys.forEach(pl => pl.forEach(([x, y]) => bd = Math.max(bd, Math.hypot(x, y))));
  LANDS.push({ id: 'main', F: MAIN, polys, bound: (bd + 6) / R });
  for (const [id, I] of Object.entries(ISLANDS)) {
    I.F = mkFrame(I.at[0], I.at[1]);
    let b = 0; I.poly.forEach(([x, y]) => b = Math.max(b, Math.hypot(x, y)));
    LANDS.push({ id, F: I.F, polys: [I.poly], bound: (b + 6) / R });
  }
})();
const LAND_BY_ID = Object.fromEntries(LANDS.map(l => [l.id, l]));

function sdPoly(poly, x, y) {
  let inside = false, md = 1e18;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
    const dx = xj - xi, dy = yj - yi;
    let t = ((x - xi) * dx + (y - yi) * dy) / (dx * dx + dy * dy); t = t < 0 ? 0 : t > 1 ? 1 : t;
    const ex = xi + dx * t - x, ey = yi + dy * t - y, d2 = ex * ex + ey * ey;
    if (d2 < md) md = d2;
  }
  md = Math.sqrt(md); return inside ? md : -md;
}
function segDist(x, y, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  let t = ((x - a[0]) * dx + (y - a[1]) * dy) / (dx * dx + dy * dy); t = clamp(t, 0, 1);
  return [Math.hypot(a[0] + dx * t - x, a[1] + dy * t - y), t];
}

/* 特殊地形：山丘、玄武岩崖、沙洲（座標：插畫像素或離島區域座標） */
const BUMPS = [
  { land: 'main', at: P(470, 578), r: 4.5, a: 2.4 },   // 蛇頭山
  { land: 'main', at: P(892, 378), r: 3.2, a: 1.6 },   // 奎壁山
  { land: 'main', at: P(338, 146), r: 3.5, a: 1.1 },   // 小門
  { land: 'main', at: P(292, 480), r: 3.8, a: 1.4 },   // 西臺
  { land: 'main', at: P(700, 312), r: 3.5, a: 0.9 },   // 中屯
  { land: 'qimei', at: [3, -4.5], r: 4, a: 2.2 },      // 七美 雙心石滬觀景台
  { land: 'hujing', at: [5.5, 1], r: 3.5, a: 2.0 },
  { land: 'tongpan', at: [0, 0], r: 6, a: 0.9 },
  { land: 'wangan', at: [-2, 3], r: 4, a: 1.2 },
];
const BASALT = [
  { land: 'main', at: P(300, 350), r: 7 }, { land: 'main', at: P(372, 362), r: 6 }, { land: 'main', at: P(350, 140), r: 6 },
  { land: 'main', at: P(450, 615), r: 5 }, { land: 'tongpan', at: [0, 0], r: 12 }, { land: 'qimei', at: [4, -6], r: 5 }, { land: 'main', at: P(255, 418), r: 3 },
];
// 奎壁山 摩西分海：退潮才露出的 S 形礫石步道
const SANDBARS = [[912, 352], [924, 338], [938, 337], [948, 324], [958, 314]].reduce((o, p, i, a) => (i && o.push({ a: P(...a[i - 1]), b: P(...p), w: 1.5, h: -0.12 }), o), []);
const BRIDGES = [
  { id: 'kuahai', a: P(426, 186), b: P(470, 126), w: 1.9, h0: 0.62, arch: 0.9, style: 'big' },
  { id: 'zz1', a: P(645, 210), b: P(645, 242), w: 1.7, h0: 0.55, arch: 0.25, style: 'low' },
  { id: 'zz2', a: P(662, 276), b: P(688, 298), w: 1.7, h0: 0.55, arch: 0.25, style: 'low' },
  { id: 'zz3', a: P(702, 336), b: P(706, 364), w: 1.7, h0: 0.55, arch: 0.25, style: 'low' },
  { id: 'twin', a: P(285, 420), b: P(262, 418), w: 1.3, h0: 0.55, arch: 0.55, style: 'twin' },     // 小池角雙曲橋（T 字形）
  { id: 'twinT', a: P(262, 401), b: P(262, 435), w: 1.4, h0: 0.55, arch: 0, style: 'low' },
  { id: 'heaven1', a: P(592, 72), b: P(585, 58), w: 1.7, h0: 0.6, arch: 0, style: 'wall' },        // 後寮天堂路防波堤
  { id: 'heaven2', a: P(585, 58), b: P(595, 46), w: 1.7, h0: 0.6, arch: 0, style: 'wall' },
  { id: 'heaven3', a: P(595, 46), b: P(589, 33), w: 1.7, h0: 0.6, arch: 0, style: 'wall' },
];

const _ld = { sd: -99, land: null, x: 0, y: 0 };
function landInfo(p) {
  _ld.sd = -99; _ld.land = null;
  for (const L of LANDS) {
    const a = Math.acos(clamp(p.dot(L.F.c), -1, 1));
    if (a > L.bound) continue;
    const [x, y] = d2l(L.F, p);
    for (const pl of L.polys) {
      const s = sdPoly(pl, x, y);
      if (s > _ld.sd) { _ld.sd = s; _ld.land = L.id; _ld.x = x; _ld.y = y; }
    }
  }
  // 海岸線加一點不規則
  if (_ld.sd > -6) _ld.sd += (fbm(p.x * 22, p.y * 22, p.z * 22) - 0.5) * 2.2;
  return _ld;
}
function zoneAmt(list, info, extra) {
  let m = 0;
  for (const z of list) {
    if (z.land !== info.land) continue;
    const d = Math.hypot(info.x - z.at[0], info.y - z.at[1]);
    if (d < z.r) m = Math.max(m, extra ? (1 - (d / z.r) ** 2) : smooth(z.r, z.r * 0.4, d));
  }
  return m;
}
function terrainH(p) {
  const I = landInfo(p), sd = I.sd;
  let h;
  if (sd < 0) {
    h = -0.06 + sd * 0.32; if (h < -2.4) h = -2.4;
    if (I.land === 'main') {
      for (const s of SANDBARS) { const [d] = segDist(I.x, I.y, s.a, s.b); if (d < s.w) h = Math.max(h, s.h - d * 0.08); }
    }
  } else {
    const bas = zoneAmt(BASALT, I);
    h = lerp(0.55 * smooth(0, 2.4, sd), 1.5 * smooth(0, 0.9, sd), bas);
    h += smooth(2.5, 10, sd) * Math.max(0, fbm(p.x * 9, p.y * 9 + 3, p.z * 9) - 0.42) * 1.5;
    for (const b of BUMPS) {
      if (b.land !== I.land) continue;
      const d = Math.hypot(I.x - b.at[0], I.y - b.at[1]);
      if (d < b.r) h += b.a * Math.pow(1 - (d / b.r) ** 2, 2) * smooth(0, 1.5, sd);
    }
  }
  return h;
}
function bridgeAt(p) {
  // 回傳 {h,b} 若在橋面或碼頭上
  for (const b of BRIDGES) {
    if (!b.c) { b.F = b.F || MAIN; b.c = l2d(b.F, (b.a[0] + b.b[0]) / 2, (b.a[1] + b.b[1]) / 2); b.len = Math.hypot(b.b[0] - b.a[0], b.b[1] - b.a[1]) / 2 + b.w; }
    if (Math.acos(clamp(p.dot(b.c), -1, 1)) * R > b.len) continue;
    const [x, y] = d2l(b.F, p);
    const [d, t] = segDist(x, y, b.a, b.b);
    if (d < b.w * 0.5) return { h: b.h0 + b.arch * Math.sin(Math.PI * t), b };
  }
  return null;
}

/* ---------- 時間與潮汐 ---------- */
const TIME = { min: 9 * 60, speed: 2 };  // 遊戲分鐘；每真實秒 2 分鐘
const hourNow = () => (TIME.min / 60) % 24;
function tideVal(h = hourNow()) { return -Math.cos(2 * Math.PI * (h - 10) / 12.4); } // -1 退潮 … 1 漲潮
const waterLevel = () => -0.075 + 0.275 * tideVal();
function groundAt(p) {
  const br = bridgeAt(p);
  const t = terrainH(p);
  if (br && br.h > t) return { h: br.h, bridge: br.b, ok: true };
  return { h: t, bridge: null, ok: t > waterLevel() - 0.2 };
}
/* =========================================================
   world: renderer、材質、合併建模器、地形、海、天空、雲、道路
   ========================================================= */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });

function bridgeModel(b) {
  const ch = chunkFor(l2d(MAIN, (b.a[0] + b.b[0]) / 2, (b.a[1] + b.b[1]) / 2));
  const L = Math.hypot(b.b[0] - b.a[0], b.b[1] - b.a[1]), yaw = Math.atan2(b.b[0] - b.a[0], b.b[1] - b.a[1]);
  const n = Math.ceil(L / 0.6), m = new THREE.Matrix4();
  for (let i = 0; i < n; i++) {
    const t = (i + 0.5) / n, x = lerp(b.a[0], b.b[0], t), y = lerp(b.a[1], b.b[1], t);
    const deck = b.h0 + b.arch * Math.sin(Math.PI * t);
    const slope = Math.atan(b.arch * Math.PI * Math.cos(Math.PI * t) / L);
    const gb = new GB();
    const seg = L / n + 0.04;
    if (b.style === 'wall') {
      gb.add(GEO.box, 0xc9c5ba, 0, -1.4, 0, -slope, 0, 0, b.w + 0.3, 2.8, seg);
      gb.add(GEO.box, 0xdcd8cd, 0, -0.03, 0, -slope, 0, 0, b.w - 0.2, 0.06, seg);
      if (i % 2 === 0) for (const s of [-1, 1]) gb.add(GEO.sph[6], 0xb3aea2, s * (b.w / 2 + 0.45), -0.35, rr(-0.2, 0.2), rnd(), rnd(), 0, 0.55, 0.45, 0.55);
    } else if (b.style === 'twin') {
      for (const s of [-1, 1]) {
        const off = s * (0.35 + 0.25 * Math.sin(Math.PI * t * 2));
        gb.add(GEO.box, 0xece6d6, off, -0.12, 0, -slope, 0, 0, 0.6, 0.18, seg);
        gb.add(GEO.box, 0xffffff, off + s * 0.32, 0.25, 0, -slope, 0, 0, 0.06, 0.06, seg);
        if (i % 2 === 0) gb.box(0.05, 0.4, 0.05, 0xffffff, off + s * 0.32, 0.08, 0);
      }
      gb.add(GEO.box, 0xd8d0bd, 0, -0.14, 0, -slope, 0, 0, 0.3, 0.12, seg);
    } else {
      gb.add(GEO.box, 0xe9e5da, 0, -0.14, 0, -slope, 0, 0, b.w + 0.2, 0.3, seg);
      gb.add(GEO.box, 0x9d9b94, 0, 0.0, 0, -slope, 0, 0, b.w - 0.4, 0.02, seg);
      for (const s of [-1, 1]) {
        gb.add(GEO.box, b.style === 'big' ? 0xffffff : 0xdedad0, s * (b.w / 2 + 0.05), 0.32, 0, -slope, 0, 0, 0.1, 0.1, seg);
        gb.add(GEO.box, K.teal, s * (b.w / 2 + 0.05), 0.12, 0, -slope, 0, 0, 0.08, 0.06, seg);
      }
      if (b.style === 'big' && i % 4 === 0) {
        gb.cyl(0.35, 0.45, deck + 2.6, 0xe9e5da, 0, -(deck + 2.6) / 2 - 0.25, 0, 8);
        gb.cyl(0.04, 0.04, 1.6, 0x55707a, b.w / 2 + 0.05, 0.9, 0, 6);
        CHUNKS_GLOWQ.push([ch, (gl => gl.sph(0.13, 0xfff0c0, b.w / 2 - 0.15, 1.7, 0, 1, 0.7, 1, 8)), x, y, yaw, deck]);
      }

    }
    placeMat(MAIN, x, y, yaw, 0, m, deck);
    ch.gb.merge(gb, m);
  }

function weir(F, pts, closed, top = 0.02) {

function buildWorld() {
  buildTerrain(); WATER = buildWater(); buildClouds(); buildRoads();
  for (const r of ROADS_MAIN) for (let i = 0; i < r.length - 1; i++) ROADSEG.push([P(...r[i]), P(...r[i + 1])]);
  for (const b of BRIDGES) if (b.style !== 'pier') bridgeModel(b);
  for (const s of SPOTS) { s.dir = locDir(s.L); s.build && s.build(s.L); }
  for (const k in HARBORS) {
    const h = HARBORS[k];
    const dx = h.berth[0] - h.land[0], dy = h.berth[1] - h.land[1], l = Math.hypot(dx, dy);
    const end = [h.land[0] + dx / l * (l - 2.2), h.land[1] + dy / l * (l - 2.2)];
    h.yaw = pierBetween(h.F, h.land, end, 1.8);

const TK = { br: 0 };

/* ---------- 光線與晝夜 ---------- */
const LIGHT = { day: 1, sunDir: new V3() };
const CL = { dayTop: new THREE.Color(0x58b8e6), dayHor: new THREE.Color(0xd5f1ef), duskTop: new THREE.Color(0x6a78c0), duskHor: new THREE.Color(0xffbd8a), nTop: new THREE.Color(0x0c1a38), nHor: new THREE.Color(0x24406a), sunDay: new THREE.Color(0xfff3dc), sunDusk: new THREE.Color(0xffa766), moon: new THREE.Color(0x9fb5e8), hemiDay: new THREE.Color(0xeaf8ff), hemiNight: new THREE.Color(0x5a74b0) };
const _c1 = new THREE.Color(), _c2 = new THREE.Color();
function updateLighting() {
  const h = hourNow(); const ang = Math.PI * (h - 5.8) / 13, el = Math.sin(ang);
  const day = smooth(-0.1, 0.22, el), dusk = Math.exp(-(((el - 0.06) / 0.14) ** 2));
  LIGHT.day = day;
  const mapLike = GAME.mode === 'map' || GAME.mode === 'title';
  const U = mapLike ? camera.position.clone().normalize() : PL.dir.clone();
  const E = tangentize(MAIN.e.clone(), U), N = new V3().crossVectors(U, E);
  let sd;
  if (mapLike) sd = U.clone().multiplyScalar(0.8).addScaledVector(E, 0.35).addScaledVector(N, 0.45).normalize();
  else if (day > 0.15) sd = U.clone().multiplyScalar(Math.max(el, 0.18)).addScaledVector(E, Math.cos(ang)).addScaledVector(N, -0.35).normalize();
  else sd = U.clone().multiplyScalar(0.7).addScaledVector(E, -0.5).addScaledVector(N, 0.3).normalize();
  LIGHT.sunDir.copy(sd);
  const md = mapLike ? 1 : day;
  const focus = mapLike ? new V3() : PL.dir.clone().multiplyScalar(R + PL.h);
  sun.position.copy(focus).addScaledVector(sd, 70); sun.target.position.copy(focus);
  _c1.copy(CL.sunDay).lerp(CL.sunDusk, mapLike ? 0 : dusk); sun.color.copy(md > 0.15 ? _c1 : CL.moon);
  sun.intensity = mapLike ? 0.75 : lerp(0.22, 0.72, day);
  hemi.position.copy(U);
  if (FLASH.v <= 0) hemi.color.copy(CL.hemiNight).lerp(CL.hemiDay, md); hemi.intensity = (mapLike ? 0.5 : lerp(0.28, 0.46, day)) + FLASH.v * 0.5;
  const dk = mapLike ? 0 : dusk;
  _c1.copy(CL.nTop).lerp(CL.dayTop, md).lerp(CL.duskTop, dk * 0.6);
  _c2.copy(CL.nHor).lerp(CL.dayHor, md).lerp(CL.duskHor, dk * 0.75);
  SKY_U.uTop.value.copy(_c1); SKY_U.uHor.value.copy(_c2); SKY_U.uUp.value.copy(mapLike ? camera.up : U);
  SKY_U.uSun.value.copy(day > 0.15 || mapLike ? sd : sd.clone().negate()); SKY_U.uSunC.value.copy(day > 0.15 ? sun.color : CL.moon).multiplyScalar(day > 0.15 ? 1 : 0.5);

  scene.fog.color.copy(_c2);
  WATER_U.uDay.value = md; WATER_U.uSun.value.copy(sd); WATER_U.uSky.value.copy(_c2);
  GLOW.color.setRGB(lerp(1.3, 0.42, md), lerp(1.08, 0.58, md), lerp(0.72, 0.68, md));
  OUTLINE.uniforms.uColor.value.setHex(md > 0.5 ? 0x29434a : 0x101c2a);

  else { scene.fog.near = 46; scene.fog.far = 155; }

}
function updateChunks() {

  const f = PL.boat ? FERRY.position.clone().normalize() : PL.dir;
  for (const k in CHUNKS) { const c = CHUNKS[k]; const v = all || angDist(f, c.c) < 82; if (c.mesh) c.mesh.visible = v; if (c.gmesh) c.gmesh.visible = v; }
  for (const s of SHELL_OBJ) if (!S.shells.includes(s.id)) s.m.visible = all ? false : angDist(f, s.dir) < 45;
  const mapMode = GAME.mode === 'map';

/* ---------- 聲音 ---------- */
const AU = { ctx: null };
function initAudio() {
  if (AU.ctx) return;
  try {
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    const ctx = AU.ctx = new C();
    AU.master = ctx.createGain(); AU.master.gain.value = 0.9; AU.master.connect(ctx.destination);
    AU.sfx = ctx.createGain(); AU.sfx.connect(AU.master); AU.mus = ctx.createGain(); AU.mus.connect(AU.master);
    // 海浪

    let b0 = 0; for (let i = 0; i < len; i++) { b0 = 0.985 * b0 + 0.015 * (Math.random() * 2 - 1); d[i] = b0 * 6; }
    const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700;
    const wg = ctx.createGain(); wg.gain.value = 0.16;
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.11; const lg = ctx.createGain(); lg.gain.value = 0.1; lfo.connect(lg); lg.connect(wg.gain); lfo.start();
    src.connect(lp); lp.connect(wg); wg.connect(AU.sfx); src.start();
    AU.noise = buf; applySound(); musicLoop();
  } catch (e) { AU.ctx = null; }
}
function applySound() {
  if (AU.ctx) { AU.mus.gain.value = S.music ? 0.5 : 0; AU.sfx.gain.value = S.sfx ? 1 : 0; }
  $('bSound').classList.toggle('off', !S.music && !S.sfx); $('bSound').title = `聲音：音樂${S.music ? '開' : '關'}・音效${S.sfx ? '開' : '關'}`;
}
function cycleSound() { initAudio(); if (S.music && S.sfx) S.music = false; else if (S.sfx) S.sfx = false; else { S.music = true; S.sfx = true; } applySound(); toast(`音樂${S.music ? '開' : '關'}・音效${S.sfx ? '開' : '關'}`); saveGame(); }
function tone(f, t, dur, type = 'sine', vol = 0.2, dest = AU.sfx, slide) {
  const c = AU.ctx, o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.05);
}
function noiseHit(t, dur, freq, vol, type = 'lowpass') {
  const c = AU.ctx, s = c.createBufferSource(); s.buffer = AU.noise; const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq; const g = c.createGain();
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); s.connect(f); f.connect(g); g.connect(AU.sfx); s.start(t, rnd() * 2); s.stop(t + dur + 0.05);
}
function sfx(k) {
  if (!AU.ctx || !S.sfx) return; const t = AU.ctx.currentTime;
  switch (k) {
    case 'blip': tone(880, t, 0.08, 'triangle', 0.12); break;
    case 'tick': tone(1320, t, 0.04, 'square', 0.03); break;
    case 'coin': tone(988, t, 0.09, 'triangle', 0.15); tone(1480, t + 0.07, 0.16, 'triangle', 0.15); break;
    case 'bad': tone(300, t, 0.2, 'sawtooth', 0.06, AU.sfx, 180); break;
    case 'done': [784, 988, 1175, 1568].forEach((f, i) => tone(f, t + i * 0.08, 0.25, 'triangle', 0.14)); break;
    case 'stamp': noiseHit(t, 0.18, 400, 0.6); tone(110, t, 0.2, 'sine', 0.5); break;
    case 'fire': [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, t + i * 0.06, 0.5, 'sine', 0.12)); break;
    case 'splash': noiseHit(t, 0.25, 1800, 0.12, 'bandpass'); break;
    case 'shutter': noiseHit(t, 0.06, 4000, 0.3, 'highpass'); noiseHit(t + 0.08, 0.05, 3000, 0.2, 'highpass'); break;
    case 'horn': tone(196, t, 1.0, 'sawtooth', 0.05); tone(247, t, 1.0, 'sawtooth', 0.04); break;
    case 'launch': tone(400, t, 1.0, 'sine', 0.03, AU.sfx, 1600); break;
    case 'boom': noiseHit(t, 1.2, 220, 0.9); noiseHit(t + 0.05, 0.6, 3000, 0.08, 'highpass'); break;
    case 'plane': noiseHit(t, 2.5, 500, 0.25); break;

const MEL = [[76, 79, 81, 79, 76, 74, 72, 74, 76, 0, 79, 0, 81, 84, 81, 79], [81, 79, 76, 74, 72, 74, 76, 79, 74, 0, 72, 0, 69, 72, 74, 0], [76, 76, 79, 81, 84, 81, 79, 76, 77, 0, 76, 74, 72, 0, 74, 76], [79, 0, 76, 74, 72, 74, 72, 69, 72, 0, 0, 0, 72, 0, 0, 0]];
const BASS = [48, 45, 41, 43];
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function musicLoop() {
  const c = AU.ctx, step = 60 / 92 / 2; let next = c.currentTime + 0.2, i = 0;
  setInterval(() => {
    if (!AU.ctx) return;
    while (next < c.currentTime + 0.3) {
      const bar = (i >> 4) % 4, s = i % 16, n = MEL[bar][s];
      const night = LIGHT.day < 0.4;

      if (s % 8 === 0) tone(mtof(BASS[bar] - 12), next, step * 7, 'sine', 0.08, AU.mus);

function playSong() {

}

/* ---------- 主迴圈 ---------- */
const clock = new THREE.Clock();
let saveT = 0, hudT = 0;
function updatePrompt() {
  const p = $('prompt');

  else t = (S.stamps.includes(NEAR.o.id) ? '查看〈' : '蓋章〈') + NEAR.o.name.replace(/（.*）/, '') + '〉';
  if ($('promptT').textContent !== t) $('promptT').textContent = t;

function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w < h ? 62 : 52; camera.updateProjectionMatrix(); }

}
function refreshWorldState() {

  for (const s of SHELL_OBJ) s.m.visible = !S.shells.includes(s.id);
  for (const s of STONE_OBJ) s.m.visible = !S.stones.includes(s.id);
  if (S.fire.includes('jibei')) { JIBEI.gap.visible = true; spawnWeirFish(); }
  else if (S.flags.jbStart) showJibeiStones();

}

  $('fade').style.opacity = 0;

function boot() {
